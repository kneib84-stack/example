
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#171512" />
  <title>Cozy Cup — меню кофейни</title>

  <!-- Telegram Mini Apps API -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    :root {
      --bg: #171512;
      --surface: #211e1a;
      --surface-light: #2b2722;
      --text: #f8f3ec;
      --muted: #a9a096;
      --accent: #e9a15b;
      --accent-dark: #bd7537;
      --border: rgba(255, 255, 255, 0.07);
      --radius: 20px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--bg);
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(
          ellipse at 90% 0%,
          rgba(160, 91, 42, 0.14),
          transparent 38%
        ),
        var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      min-height: 100dvh;
    }

    button {
      font: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .app {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      padding: 0 18px;
      padding-bottom: calc(170px + env(safe-area-inset-bottom));
    }

    /* Шапка */

    .header {
      padding-top: calc(26px + env(safe-area-inset-top));
      padding-bottom: 26px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 30px;
    }

    .brand-icon {
      width: 43px;
      height: 43px;
      display: grid;
      place-items: center;
      border-radius: 15px;
      background: linear-gradient(145deg, #f4bd7e, #bd7537);
      font-size: 23px;
      box-shadow: 0 5px 20px rgba(233, 161, 91, 0.16);
    }

    .brand-name {
      font-size: 19px;
      font-weight: 750;
      letter-spacing: -0.5px;
    }

    .brand-subtitle {
      margin-top: 3px;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 1.7px;
      text-transform: uppercase;
    }

    .eyebrow {
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 8vw, 42px);
      line-height: 1.1;
      letter-spacing: -1.5px;
      font-weight: 750;
    }

    h1 span {
      color: var(--accent);
    }

    .welcome-text {
      margin: 13px 0 0;
      max-width: 310px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.65;
    }

    .hero-note {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-top: 22px;
      padding: 13px 15px;
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid var(--border);
      border-radius: 15px;
      color: #d9c9b7;
      font-size: 12px;
    }

    .hero-note span:first-child {
      font-size: 18px;
    }

    /* Категории и товары */

    .category {
      margin-top: 25px;
    }

    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 15px;
    }

    h2 {
      margin: 0;
      font-size: 22px;
      letter-spacing: -0.5px;
    }

    .section-count {
      color: var(--muted);
      font-size: 12px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .product {
      min-width: 0;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
    }

    .product-art {
      position: relative;
      display: grid;
      place-items: center;
      height: 126px;
      background:
        radial-gradient(circle at 50% 60%,
          rgba(233, 161, 91, 0.17), transparent 62%),
        linear-gradient(145deg, #30251e, #211e1a);
      font-size: 57px;
    }

    .product-art.dessert {
      background:
        radial-gradient(circle at 50% 60%,
          rgba(218, 158, 105, 0.16), transparent 62%),
        linear-gradient(145deg, #302620, #211e1a);
    }

    .product-info {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      flex: 1;
      padding: 13px 12px 12px;
    }

    .product-name {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
      line-height: 1.35;
    }

    .product-description {
      min-height: 35px;
      margin: 7px 0 13px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.55;
    }

    .product-bottom {
      display: flex;
      flex-direction: column;
      gap: 11px;
      margin-top: auto;
    }

    .price {
      font-size: 19px;
      font-weight: 750;
      letter-spacing: -0.4px;
    }

    .price small {
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
    }

    .add-button {
      width: 100%;
      min-height: 39px;
      padding: 8px 10px;
      border: none;
      border-radius: 12px;
      color: #25180e;
      background: var(--accent);
      font-size: 12px;
      font-weight: 750;
      cursor: pointer;
      transition: background 0.15s, transform 0.15s;
    }

    .add-button:active {
      transform: scale(0.97);
    }

    .add-button:hover {
      background: #f2b777;
    }

    .quantity-control {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 39px;
      padding: 3px;
      border-radius: 12px;
      background: var(--surface-light);
    }

    .quantity-control button {
      width: 33px;
      height: 33px;
      flex-shrink: 0;
      border: none;
      border-radius: 9px;
      background: #393129;
      color: var(--text);
      font-size: 20px;
      cursor: pointer;
    }

    .quantity-control span {
      font-size: 14px;
      font-weight: 700;
    }

    /* Закреплённая корзина */

    .cart-bar {
      position: fixed;
      z-index: 10;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 13px 18px;
      padding-bottom: calc(13px + env(safe-area-inset-bottom));
      background: rgba(23, 21, 18, 0.95);
      border-top: 1px solid var(--border);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .cart-inner {
      max-width: 524px;
      margin: 0 auto;
    }

    .empty-cart {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 42px;
      color: var(--muted);
      font-size: 13px;
    }

    .cart-summary {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .cart-label {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .cart-quantity {
      font-size: 15px;
      font-weight: 700;
    }

    .cart-total {
      font-size: 23px;
      font-weight: 800;
      letter-spacing: -0.7px;
      text-align: right;
    }

    .checkout-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      min-height: 54px;
      padding: 15px 18px;
      border: none;
      border-radius: 16px;
      background: linear-gradient(135deg, #f2b777, #e9a15b);
      color: #25180e;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
    }

    .checkout-button:active {
      transform: scale(0.99);
    }

    .checkout-button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    /* Сообщения */

    .toast {
      position: fixed;
      z-index: 20;
      top: calc(15px + env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      width: max-content;
      max-width: calc(100% - 32px);
      padding: 13px 17px;
      border-radius: 13px;
      background: #393129;
      border: 1px solid rgba(233, 161, 91, 0.3);
      color: var(--text);
      font-size: 13px;
      line-height: 1.5;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
    }

    [hidden] {
      display: none !important;
    }

    @media (min-width: 430px) {
      .product-art {
        height: 145px;
      }

      .product-info {
        padding: 15px;
      }

      .product-name {
        font-size: 16px;
      }

      .product-description {
        font-size: 12px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <header class="header">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">☕</div>
        <div>
          <div class="brand-name">Cozy Cup</div>
          <div class="brand-subtitle">Coffee &amp; comfort</div>
        </div>
      </div>

      <div class="eyebrow">Твоя пауза</div>
      <h1>Немного тепла<br />в каждой <span>чашке.</span></h1>
      <p class="welcome-text">
        Свежий кофе, нежные десерты и минуты,
        которые хочется оставить себе.
      </p>

      <div class="hero-note">
        <span aria-hidden="true">✦</span>
        <span>Выбирай любимое — мы позаботимся об остальном</span>
      </div>
    </header>

    <section class="category" aria-labelledby="coffee-title">
      <div class="section-heading">
        <h2 id="coffee-title">Кофе</h2>
        <span class="section-count">01 / COFFEE</span>
      </div>
      <div class="products" id="coffee-products"></div>
    </section>

    <section class="category" aria-labelledby="dessert-title">
      <div class="section-heading">
        <h2 id="dessert-title">Десерты</h2>
        <span class="section-count">02 / SWEETS</span>
      </div>
      <div class="products" id="dessert-products"></div>
    </section>
  </main>

  <aside class="cart-bar" aria-label="Корзина">
    <div class="cart-inner">
      <div class="empty-cart" id="empty-cart">
        <span aria-hidden="true">🛍️</span>
        <span>Корзина пока пуста</span>
      </div>

      <div id="filled-cart" hidden>
        <div class="cart-summary">
          <div>
            <div class="cart-label">Твой заказ</div>
            <div class="cart-quantity" id="cart-quantity">0 товаров</div>
          </div>
          <div>
            <div class="cart-label">Итого</div>
            <div class="cart-total" id="cart-total">0 ₽</div>
          </div>
        </div>

        <button class="checkout-button" id="checkout-button" type="button">
          <span>Оформить заказ</span>
          <span aria-hidden="true">→</span>
        </button>
      </div>
    </div>
  </aside>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script>
    "use strict";

    // =============================================
    // 1. ТОВАРЫ
    // Здесь можно менять названия, описания и цены.
    // price указывается обычным числом в рублях.
    // =============================================

    const products = [
      {
        id: "espresso",
        category: "coffee",
        name: "Эспрессо",
        description: "Насыщенный вкус и бодрящий аромат.",
        price: 150,
        emoji: "☕"
      },
      {
        id: "cappuccino",
        category: "coffee",
        name: "Капучино",
        description: "Нежная молочная пена и двойной эспрессо.",
        price: 250,
        emoji: "🥛"
      },
      {
        id: "latte",
        category: "coffee",
        name: "Латте",
        description: "Мягкий кофейный вкус и шелковистое молоко.",
        price: 280,
        emoji: "🤎"
      },
      {
        id: "croissant",
        category: "dessert",
        name: "Круассан",
        description: "Хрустящий снаружи, нежный внутри.",
        price: 180,
        emoji: "🥐"
      },
      {
        id: "cheesecake",
        category: "dessert",
        name: "Чизкейк",
        description: "Сливочный десерт на песочной основе.",
        price: 290,
        emoji: "🍰"
      },
      {
        id: "cookie",
        category: "dessert",
        name: "Шоколадное печенье",
        description: "Рассыпчатое печенье с кусочками шоколада.",
        price: 120,
        emoji: "🍪"
      }
    ];

    // Корзина хранит количество каждого товара.
    // Пример: { cappuccino: 2, croissant: 1 }
    const cart = {};

    const tg = window.Telegram?.WebApp;

    if (tg) {
      tg.ready();
      tg.expand();

      // Подстраиваем цвета под тему Telegram.
      // Основной фирменный стиль остаётся тёмным.
      try {
        tg.setHeaderColor("#171512");
        tg.setBackgroundColor("#171512");
      } catch (error) {
        console.warn("Не удалось настроить тему Telegram:", error);
      }
    }

    const money = (value) =>
      new Intl.NumberFormat("ru-RU").format(value) + " ₽";

    // =============================================
    // 2. ОТОБРАЖЕНИЕ КАРТОЧЕК ТОВАРОВ
    // =============================================

    function renderProducts() {
      const coffeeContainer = document.getElementById("coffee-products");
      const dessertContainer = document.getElementById("dessert-products");

      coffeeContainer.innerHTML = "";
      dessertContainer.innerHTML = "";

      products.forEach((product) => {
        const card = document.createElement("article");
        card.className = "product";

        const art = document.createElement("div");
        art.className = "product-art" +
          (product.category === "dessert" ? " dessert" : "");
        art.textContent = product.emoji;
        art.setAttribute("aria-hidden", "true");

        const info = document.createElement("div");
        info.className = "product-info";

        const name = document.createElement("h3");
        name.className = "product-name";
        name.textContent = product.name;

        const description = document.createElement("p");
        description.className = "product-description";
        description.textContent = product.description;

        const bottom = document.createElement("div");
        bottom.className = "product-bottom";

        const price = document.createElement("div");
        price.className = "price";
        price.textContent = money(product.price);

        const controls = document.createElement("div");
        controls.dataset.productId = product.id;
        controls.className = "product-controls";

        bottom.append(price, controls);
        info.append(name, description, bottom);
        card.append(art, info);

        const container = product.category === "coffee"
          ? coffeeContainer
          : dessertContainer;

        container.append(card);
      });

      updateProductControls();
    }

    // =============================================
    // 3. ДОБАВЛЕНИЕ И УДАЛЕНИЕ ТОВАРОВ
    // =============================================

    function changeQuantity(productId, delta) {
      const current = cart[productId] || 0;
      const next = current + delta;

      if (next <= 0) {
        delete cart[productId];
      } else {
        cart[productId] = next;
      }

      updateProductControls();
      updateCart();
    }

    function updateProductControls() {
      document.querySelectorAll(".product-controls").forEach((container) => {
        const productId = container.dataset.productId;
        const quantity = cart[productId] || 0;
        container.replaceChildren();

        if (quantity === 0) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "add-button";
          button.textContent = "Добавить";
          button.setAttribute("aria-label", "Добавить товар в корзину");

          button.addEventListener("click", () => {
            changeQuantity(productId, 1);
          });

          container.append(button);
          return;
        }

        const controls = document.createElement("div");
        controls.className = "quantity-control";

        const minus = document.createElement("button");
        minus.type = "button";
        minus.textContent = "−";
        minus.setAttribute("aria-label", "Уменьшить количество");

        minus.addEventListener("click", () => {
          changeQuantity(productId, -1);
        });

        const count = document.createElement("span");
        count.textContent = String(quantity);
        count.setAttribute("aria-live", "polite");

        const plus = document.createElement("button");
        plus.type = "button";
        plus.textContent = "+";
        plus.setAttribute("aria-label", "Увеличить количество");

        plus.addEventListener("click", () => {
          changeQuantity(productId, 1);
        });

        controls.append(minus, count, plus);
        container.append(controls);
      });
    }

    // =============================================
    // 4. ПЕРЕСЧЁТ КОРЗИНЫ
    // =============================================

    function getOrder() {
      return products
        .filter((product) => (cart[product.id] || 0) > 0)
        .map((product) => ({
          id: product.id,
          name: product.name,
          price: product.price,
          quantity: cart[product.id],
          subtotal: product.price * cart[product.id]
        }));
    }

    function updateCart() {
      const order = getOrder();
      const totalQuantity = order.reduce(
        (sum, item) => sum + item.quantity, 0
      );
      const totalPrice = order.reduce(
        (sum, item) => sum + item.subtotal, 0
      );

      const emptyCart = document.getElementById("empty-cart");
      const filledCart = document.getElementById("filled-cart");

      emptyCart.hidden = totalQuantity > 0;
      filledCart.hidden = totalQuantity === 0;

      document.getElementById("cart-quantity").textContent =
        totalQuantity + " " + pluralize(totalQuantity);

      document.getElementById("cart-total").textContent =
        money(totalPrice);
    }

    function pluralize(number) {
      const n = Math.abs(number) % 100;
      const last = n % 10;

      if (n > 10 && n < 20) return "товаров";
      if (last > 1 && last < 5) return "товара";
      if (last === 1) return "товар";
      return "товаров";
    }

    // =============================================
    // 5. УВЕДОМЛЕНИЯ
    // =============================================

    let toastTimer;

    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.hidden = false;

      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.hidden = true;
      }, 3500);
    }

    // =============================================
    // 6. ОФОРМЛЕНИЕ ЗАКАЗА В TELEGRAM
    // =============================================

    function checkout() {
      const order = getOrder();

      if (order.length === 0) {
        showToast("Сначала добавь что-нибудь в корзину.");
        return;
      }

      if (!tg || typeof tg.sendData !== "function") {
        showToast(
          "Открой меню через кнопку в Telegram-боте, " +
          "чтобы отправить заказ."
        );
        return;
      }

      const total = order.reduce(
        (sum, item) => sum + item.subtotal, 0
      );

      // Передаём структурированные данные.
      // Бот получит их в сообщении web_app_data.
      const payload = {
        type: "new_order",
        currency: "RUB",
        items: order.map((item) => ({
          id: item.id,
          name: item.name,
          price: item.price,
          quantity: item.quantity,
          subtotal: item.subtotal
        })),
        total: total,
        createdAt: new Date().toISOString()
      };

      const data = JSON.stringify(payload);

      // Telegram ограничивает размер передаваемых данных.
      if (new TextEncoder().encode(data).length > 4096) {
        showToast("Заказ слишком большой. Уменьши количество товаров.");
        return;
      }

      try {
        tg.sendData(data);

        // Telegram обычно закрывает Mini App после sendData.
        // Не очищаем корзину заранее: при ошибке данные сохранятся.
      } catch (error) {
        console.error("Ошибка отправки заказа:", error);
        showToast("Не удалось отправить заказ. Попробуй ещё раз.");
      }
    }

    document.getElementById("checkout-button")
      .addEventListener("click", checkout);

    // =============================================
    // 7. ЗАПУСК ПРИЛОЖЕНИЯ
    // =============================================

    renderProducts();
    updateCart();
  </script>
</body>
</html>
